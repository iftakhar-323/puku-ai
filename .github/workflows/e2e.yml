name: E2E (Maestro)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Maestro flows on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # The default GH-hosted ubuntu runner has ~14GB free, which isn't
      # enough for an npm install + a full Android build + an emulator
      # system image all at once ("No space left on device" killed this
      # job outright on the first run). Strip unused preinstalled toolchains
      # (.NET, Haskell, large preloaded Docker images, etc.) before doing
      # anything else to free several GB up front.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The dev flavor needs a repo-root .env.dev (see android/app/build.gradle's
      # envConfigFiles and src/config/env.ts); it isn't committed, and every
      # key falls back to a safe default if missing, so an empty file is
      # enough for the app to boot to the login screen, which is as far as
      # these smoke flows go.
      - name: Write dummy dev env file
        run: touch .env.dev

      - name: Build dev debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDevDebug --no-daemon

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            APK_PATH=$(find android/app/build/outputs/apk/dev/debug -iname "*universal*debug.apk" | head -n 1)
            adb install -r "$APK_PATH"
            maestro test .maestro/
