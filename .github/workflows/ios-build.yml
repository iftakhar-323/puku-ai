name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'package.json'
      - 'index.js'

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The runner's default Xcode (16.4) ships Swift tools 6.1, but
      # ExpoModulesJSI's SwiftPM package requires 6.2+. macos-15 also
      # has Xcode 26.x pre-installed (just not as the default). Pin to
      # the earliest 26.x (where Swift 6.2 first shipped) rather than
      # "latest-stable": 26.3's compiler is stricter about Swift/C++
      # interop annotations and fails to compile ExpoModulesJSI's
      # RuntimeScheduler.h ("cannot be annotated with
      # SWIFT_RETURNS_RETAINED... not a SWIFT_SHARED_REFERENCE type").
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Bundle iOS JavaScript
        run: npm run bundle:ios

      - name: Install CocoaPods
        working-directory: ios
        run: |
          pod install

      - name: Build iOS Application (Simulator & Device Archive)
        working-directory: ios
        run: |
          xcodebuild -workspace PukuAI.xcworkspace \
            -scheme PukuAI \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      # Actually launches the built app on a real iOS Simulator and watches
      # for a crash report, instead of only checking that it compiled. This
      # specifically exercises app startup — where React Native's bridgeless
      # init constructs the Expo JSI RuntimeScheduler — which matters because
      # patches/expo-modules-jsi+*.patch touches that type's retain/release
      # contract (removed an invalid SWIFT_RETURNS_RETAINED annotation from
      # its constructors) and a mistake there wouldn't show up as a compile
      # error, only as a runtime crash or leak.
      - name: Smoke-test app launch on iOS Simulator
        run: |
          set -e
          UDID=$(xcrun simctl list devices available iOS | grep -m1 -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "Using simulator $UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build/Build/Products/Release-iphonesimulator/PukuAI.app
          rm -rf ~/Library/Logs/DiagnosticReports/PukuAI*
          xcrun simctl launch "$UDID" com.pukuai
          sleep 10
          if ls ~/Library/Logs/DiagnosticReports/PukuAI* >/dev/null 2>&1; then
            echo "App crashed within 10s of launch:"
            cat ~/Library/Logs/DiagnosticReports/PukuAI*
            exit 1
          fi
          echo "App launched and stayed up for 10s without crashing."
          xcrun simctl shutdown "$UDID"

      - name: Package iOS Simulator App (.app.zip)
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          zip -r PukuAI-iOS.app.zip PukuAI.app
          mv PukuAI-iOS.app.zip $GITHUB_WORKSPACE/

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: puku-ai-ios-release
          path: PukuAI-iOS.app.zip
